<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CHADPDG Test</title>

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer
    ></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        #app {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 5px;
            font-size: 34px;
        }

        .tagline {
            color: #bbb;
            margin-bottom: 25px;
        }

        #chat {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            min-height: 300px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .message {
            padding: 12px 15px;
            margin-bottom: 14px;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #333;
        }

        .chad {
            background: #242424;
            border-left: 4px solid #f5c518;
        }

        .label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #555;
            resize: vertical;
        }

        #turnstile-wrap {
            margin: 15px 0;
        }

        #buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
        }

        #ask {
            background: #f5c518;
            color: #111;
        }

        #reset {
            background: #444;
            color: #fff;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            color: #aaa;
            font-size: 14px;
        }

        .error {
            color: #ff8080;
        }
    </style>
</head>

<body>

<div id="app">

    <h1>CHADPDG</h1>

    <div class="tagline">
        DIY advice from an AI who is annoyingly confident about everything.
    </div>

    <div id="chat"></div>

    <textarea
        id="question"
        placeholder="Ask Chad something..."
    ></textarea>

    <div id="turnstile-wrap">

        <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAEs8NPfO2xl4mDcY"
            data-callback="onTurnstileSuccess"
            data-expired-callback="onTurnstileExpired"
            data-error-callback="onTurnstileError"
        ></div>

    </div>

    <div id="buttons">

        <button
            id="ask"
            type="button"
        >
            ASK CHAD
        </button>

        <button
            id="reset"
            type="button"
        >
            NEW CONVERSATION
        </button>

    </div>

    <div id="status"></div>

</div>


<script>

const CHAT_STORAGE_KEY =
    "chadpdg_conversation_id";

let turnstileToken = "";

const chat =
    document.getElementById("chat");

const question =
    document.getElementById("question");

const askButton =
    document.getElementById("ask");

const resetButton =
    document.getElementById("reset");

const statusBox =
    document.getElementById("status");


function getConversationId() {

    return localStorage.getItem(
        CHAT_STORAGE_KEY
    ) || "";
}


function saveConversationId(id) {

    if (!id) {
        return;
    }

    localStorage.setItem(
        CHAT_STORAGE_KEY,
        id
    );
}


function clearConversationId() {

    localStorage.removeItem(
        CHAT_STORAGE_KEY
    );
}


function setStatus(message, isError = false) {

    statusBox.textContent =
        message || "";

    statusBox.className =
        isError ? "error" : "";
}


function addMessage(role, text) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (
            role === "user"
                ? "user"
                : "chad"
        );


    const label =
        document.createElement("div");

    label.className =
        "label";

    label.textContent =
        role === "user"
            ? "You"
            : "Chad";


    const body =
        document.createElement("div");

    body.textContent =
        text;


    wrapper.appendChild(label);
    wrapper.appendChild(body);

    chat.appendChild(wrapper);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


window.onTurnstileSuccess =
    function(token) {

        turnstileToken = token;

        setStatus(
            "Human verified. Chad is disappointed."
        );
    };


window.onTurnstileExpired =
    function() {

        turnstileToken = "";

        setStatus(
            "Verification expired. Check the box again.",
            true
        );
    };


window.onTurnstileError =
    function() {

        turnstileToken = "";

        setStatus(
            "Turnstile had a moment. Try again.",
            true
        );
    };


function resetTurnstile() {

    turnstileToken = "";

    if (
        window.turnstile &&
        typeof window.turnstile.reset === "function"
    ) {

        window.turnstile.reset();
    }
}


async function askChad() {

    const message =
        question.value.trim();


    if (!message) {

        setStatus(
            "Type a question first, champ.",
            true
        );

        return;
    }


    if (!turnstileToken) {

        setStatus(
            "Complete the human verification first.",
            true
        );

        return;
    }


    askButton.disabled = true;
    question.disabled = true;

    setStatus(
        "Chad is thinking. Try not to interrupt the miracle."
    );

    addMessage(
        "user",
        message
    );

    question.value = "";


    try {

        const response =
            await fetch(
                "/ask",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message,

                        conversation_id:
                            getConversationId(),

                        turnstile_token:
                            turnstileToken
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Chad broke something."
            );
        }


        if (data.conversation_id) {

            saveConversationId(
                data.conversation_id
            );
        }


        addMessage(
            "chad",
            data.answer ||
            "Chad answered without actually answering. Impressive."
        );


        setStatus(
            "Conversation ID: " +
            (
                data.conversation_id ||
                getConversationId() ||
                "none"
            )
        );

    } catch (error) {

        addMessage(
            "chad",
            "Something went sideways. " +
            error.message
        );

        setStatus(
            error.message,
            true
        );

    } finally {

        askButton.disabled = false;
        question.disabled = false;

        resetTurnstile();

        question.focus();
    }
}


async function newConversation() {

    resetButton.disabled = true;

    setStatus(
        "Chad is forgetting you. Surprisingly easy."
    );


    try {

        const response =
            await fetch(
                "/reset",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        conversation_id:
                            getConversationId()
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Could not reset conversation."
            );
        }


        clearConversationId();

        if (data.conversation_id) {

            saveConversationId(
                data.conversation_id
            );
        }


        chat.innerHTML = "";

        addMessage(
            "chad",
            "Fresh conversation. Try not to ruin this one."
        );

        setStatus(
            "New conversation started."
        );

        resetTurnstile();

    } catch (error) {

        setStatus(
            error.message,
            true
        );

    } finally {

        resetButton.disabled = false;
    }
}


askButton.addEventListener(
    "click",
    askChad
);


resetButton.addEventListener(
    "click",
    newConversation
);


question.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            askChad();
        }
    }
);


if (getConversationId()) {

    setStatus(
        "Existing Chad conversation loaded."
    );

} else {

    setStatus(
        "No conversation yet. Chad is enjoying the silence."
    );
}

</script>

</body>
</html>
