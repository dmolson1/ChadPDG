<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CHADPDG Core 4.1 Test</title>
    <script>
        window.chadTurnstileApiReady = false;
        window.onChadTurnstileLoad = function () {
            window.chadTurnstileApiReady = true;
            window.dispatchEvent(new Event('chad-turnstile-ready'));
        };
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onChadTurnstileLoad&render=explicit" async defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #111;
        }
        .wrap {
            width: min(900px, calc(100% - 24px));
            margin: 24px auto;
        }
        .card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }
        h1 { margin: 0 0 8px; }
        .sub { color: #555; margin-bottom: 18px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font: inherit;
        }
        textarea { min-height: 110px; resize: vertical; }
        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        button {
            padding: 11px 16px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        #ask { background: #111; color: #fff; }
        #reset { background: #ddd; color: #111; }
        #save-key { background: #0066cc; color: #fff; }
        #clear-key { background: #eee; color: #111; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        #quota {
            font-weight: 700;
            margin-top: 10px;
        }
        .admin {
            color: #0a6b22;
            font-weight: 800;
        }
        #chat { margin-top: 18px; }
        .msg {
            padding: 12px 14px;
            border-radius: 10px;
            margin: 10px 0;
            white-space: pre-wrap;
            line-height: 1.45;
        }
        .you { background: #e8f1ff; }
        .chad { background: #f1f1f1; }
        .error { background: #ffe8e8; color: #8a0000; }
        .small { font-size: 13px; color: #666; }
        #turnstile { margin-top: 12px; min-height: 1px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>CHADPDG Core 4.1 Test</h1>
        <div class="sub">DigitalOcean backend test page — private developer mode supported.</div>

        <label for="admin-key">Developer test key</label>
        <input id="admin-key" type="password" autocomplete="off"
               placeholder="Paste your CHAD_ADMIN_TEST_KEY here">
        <div class="row">
            <button id="save-key" type="button">Use Developer Key</button>
            <button id="clear-key" type="button">Clear Developer Key</button>
        </div>
        <p class="small">
            The key is stored only in this browser tab using sessionStorage.
            It is not hard-coded into this page or saved in GitHub.
        </p>
        <div id="quota">Checking status...</div>
    </div>

    <div class="card">
        <label for="question">Ask Chad</label>
        <textarea id="question" placeholder="How do I install a bathroom exhaust fan where there isn't one now?"></textarea>
        <div id="chad-turnstile-widget"></div>
        <div class="row">
            <button id="ask" type="button">Ask Chad</button>
            <button id="reset" type="button">New Conversation</button>
        </div>
        <div id="chat"></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const API_BASE = window.location.origin;
    const TURNSTILE_SITE_KEY = '0x4AAAAAAEs8NPfO2xl4mDcY';

    const visitorKey = 'chadpdg_visitor_id';
    const conversationKey = 'chadpdg_conversation_id';
    const adminSessionKey = 'chadpdg_admin_test_key';

    const adminInput = document.getElementById('admin-key');
    const saveKeyButton = document.getElementById('save-key');
    const clearKeyButton = document.getElementById('clear-key');
    const quota = document.getElementById('quota');
    const question = document.getElementById('question');
    const ask = document.getElementById('ask');
    const reset = document.getElementById('reset');
    const chat = document.getElementById('chat');

    let turnstileWidgetId = null;

    function makeId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
            return window.crypto.randomUUID().replace(/-/g, '');
        }
        return (
            Date.now().toString(36) +
            Math.random().toString(36).slice(2) +
            Math.random().toString(36).slice(2)
        );
    }

    function getVisitorId() {
        let id = localStorage.getItem(visitorKey);
        if (!id) {
            id = makeId();
            localStorage.setItem(visitorKey, id);
        }
        return id;
    }

    function getConversationId() {
        return localStorage.getItem(conversationKey) || '';
    }

    function getAdminKey() {
        return sessionStorage.getItem(adminSessionKey) || '';
    }

    function adminHeaders() {
        const key = getAdminKey();
        return key ? { 'X-Chad-Admin-Key': key } : {};
    }

    function addMessage(kind, label, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + kind;
        const strong = document.createElement('strong');
        strong.textContent = label + ': ';
        div.appendChild(strong);
        div.appendChild(document.createTextNode(text));
        chat.appendChild(div);
        div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function updateQuota(data) {
        if (data && data.admin_test_mode) {
            quota.innerHTML =
                '<span class="admin">DEVELOPER TEST MODE — UNLIMITED QUESTIONS</span>';
            ask.disabled = false;
            question.disabled = false;
            return;
        }

        const remaining =
            data && Number.isFinite(Number(data.remaining))
                ? Number(data.remaining)
                : 0;
        const limit =
            data && Number.isFinite(Number(data.daily_limit))
                ? Number(data.daily_limit)
                : 5;

        quota.textContent =
            remaining + ' of ' + limit + ' free questions remaining today';

        ask.disabled = remaining <= 0;
        question.disabled = remaining <= 0;
    }

    async function refreshStatus() {
        try {
            const url =
                API_BASE +
                '/status?visitor_id=' +
                encodeURIComponent(getVisitorId());

            const response = await fetch(url, {
                headers: adminHeaders()
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || 'Status check failed.');
            }

            updateQuota(data);
        } catch (error) {
            quota.textContent = 'Status error: ' + error.message;
        }
    }

    function renderTurnstile() {
        if (!window.turnstile) return false;
        if (turnstileWidgetId !== null) return true;

        try {
            turnstileWidgetId = window.turnstile.render('#chad-turnstile-widget', {
                sitekey: TURNSTILE_SITE_KEY,
                execution: 'execute',
                appearance: 'interaction-only',
                theme: 'auto'
            });
            return turnstileWidgetId !== null;
        } catch (error) {
            console.error('Turnstile render failed:', error);
            return false;
        }
    }

    function ensureTurnstileReady() {
        return new Promise(function (resolve, reject) {
            if (renderTurnstile()) {
                resolve();
                return;
            }

            let finished = false;

            const readyHandler = function () {
                if (finished) return;
                if (renderTurnstile()) {
                    finished = true;
                    clearTimeout(timeout);
                    window.removeEventListener('chad-turnstile-ready', readyHandler);
                    resolve();
                }
            };

            window.addEventListener('chad-turnstile-ready', readyHandler);

            const poll = setInterval(function () {
                if (finished) {
                    clearInterval(poll);
                    return;
                }

                if (renderTurnstile()) {
                    finished = true;
                    clearInterval(poll);
                    clearTimeout(timeout);
                    window.removeEventListener('chad-turnstile-ready', readyHandler);
                    resolve();
                }
            }, 100);

            const timeout = setTimeout(function () {
                if (finished) return;
                finished = true;
                clearInterval(poll);
                window.removeEventListener('chad-turnstile-ready', readyHandler);
                reject(new Error('Human verification could not load. Refresh the page and try again.'));
            }, 15000);
        });
    }

    async function getTurnstileTokenForAsk() {
        await ensureTurnstileReady();

        return new Promise(function (resolve, reject) {

            const existing =
                window.turnstile.getResponse(turnstileWidgetId) || '';

            if (existing) {
                resolve(existing);
                return;
            }

            let finished = false;

            const timeout = setTimeout(function () {
                if (!finished) {
                    finished = true;
                    reject(new Error('Human verification timed out. Try Ask Chad again.'));
                }
            }, 15000);

            try {
                window.turnstile.execute(turnstileWidgetId, {
                    callback: function (token) {
                        if (finished) return;
                        finished = true;
                        clearTimeout(timeout);
                        resolve(token || '');
                    },
                    'error-callback': function () {
                        if (finished) return;
                        finished = true;
                        clearTimeout(timeout);
                        reject(new Error('Human verification failed. Try again.'));
                    },
                    'expired-callback': function () {
                        if (finished) return;
                        finished = true;
                        clearTimeout(timeout);
                        reject(new Error('Human verification expired. Try again.'));
                    }
                });
            } catch (error) {
                if (!finished) {
                    finished = true;
                    clearTimeout(timeout);
                    reject(error);
                }
            }
        });
    }

    function resetTurnstile() {
        if (window.turnstile && turnstileWidgetId !== null) {
            window.turnstile.reset(turnstileWidgetId);
        }
    }

    saveKeyButton.addEventListener('click', async function () {
        const value = adminInput.value.trim();

        if (!value) {
            alert('Paste your private developer test key first.');
            return;
        }

        sessionStorage.setItem(adminSessionKey, value);
        adminInput.value = '';
        await refreshStatus();

        if (!quota.textContent.includes('UNLIMITED')) {
            sessionStorage.removeItem(adminSessionKey);
            alert('That key was not accepted. Developer mode is still off.');
            await refreshStatus();
        }
    });

    clearKeyButton.addEventListener('click', async function () {
        sessionStorage.removeItem(adminSessionKey);
        adminInput.value = '';
        await refreshStatus();
    });

    ask.addEventListener('click', async function () {
        const message = question.value.trim();

        if (!message) return;

        ask.disabled = true;

        try {
            const turnstileToken =
                await getTurnstileTokenForAsk();

            if (!turnstileToken) {
                throw new Error('Human verification did not return a token. Try again.');
            }

            addMessage('you', 'Hammered Handyman', message);
            question.value = '';

            const body = {
                message: message,
                visitor_id: getVisitorId(),
                conversation_id: getConversationId(),
                turnstile_token: turnstileToken
            };

            const response = await fetch(API_BASE + '/ask', {
                method: 'POST',
                headers: Object.assign(
                    { 'Content-Type': 'application/json' },
                    adminHeaders()
                ),
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                if (data && typeof data.remaining !== 'undefined') {
                    updateQuota(data);
                }
                throw new Error(data.error || 'Chad encountered a technical difficulty.');
            }

            if (data.conversation_id) {
                localStorage.setItem(
                    conversationKey,
                    data.conversation_id
                );
            }

            addMessage('chad', 'Chad', data.answer || 'No answer returned.');
            updateQuota(data);

        } catch (error) {
            addMessage('error', 'Chad', error.message);
            await refreshStatus();
        } finally {
            resetTurnstile();

            if (quota.textContent.includes('UNLIMITED')) {
                ask.disabled = false;
                question.disabled = false;
            } else if (!question.disabled) {
                ask.disabled = false;
            }
        }
    });

    reset.addEventListener('click', async function () {
        try {
            const response = await fetch(API_BASE + '/reset', {
                method: 'POST',
                headers: Object.assign(
                    { 'Content-Type': 'application/json' },
                    adminHeaders()
                ),
                body: JSON.stringify({
                    visitor_id: getVisitorId(),
                    conversation_id: getConversationId()
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || 'Could not reset conversation.');
            }

            if (data.conversation_id) {
                localStorage.setItem(
                    conversationKey,
                    data.conversation_id
                );
            } else {
                localStorage.removeItem(conversationKey);
            }

            chat.innerHTML = '';
            addMessage('chad', 'Chad', 'New conversation. Try not to ruin this one.');
            await refreshStatus();

        } catch (error) {
            addMessage('error', 'Chad', error.message);
        }
    });

    adminInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            saveKeyButton.click();
        }
    });

    question.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            ask.click();
        }
    });

    window.addEventListener('load', function () {
        ensureTurnstileReady().catch(function (error) {
            console.error(error);
        });

        refreshStatus();
    });
})();
</script>
</body>
</html>
