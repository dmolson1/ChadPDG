<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chad P.D. Chee Sponsor Dashboard</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#171b1f;font-family:Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:28px auto 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0}.sub{color:#66737d;margin-top:5px}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 14px;background:#1479bb;color:#fff;text-decoration:none;font-weight:900;cursor:pointer}.dark{background:#171b1f}.card{background:#fff;border:1px solid #dbe2e7;border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 5px 18px #0000000a}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#fafcfd;border:1px solid #e0e6eb;border-radius:11px;padding:14px}.k{font-size:10px;text-transform:uppercase;color:#687681;font-weight:900}.v{font-size:27px;font-weight:900;margin-top:5px}.campaign{border-top:1px solid #e5eaee;padding:18px 0}.campaign:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef2f5;font-size:10px;font-weight:900;text-transform:uppercase}.live{background:#e7f7ed;color:#18743b}.paid{background:#fff4cf;color:#765d00}.meta{color:#687681;font-size:12px;line-height:1.6;margin-top:8px}.empty{color:#74808a}.error{color:#a12626;font-weight:800}@media(max-width:700px){.top,.row{flex-direction:column;align-items:stretch}.metrics{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1 id="title">Sponsor Dashboard</h1><div class="sub">First-party campaign performance for Chad P.D. Chee.</div></div><div><a class="btn" href="/advertise.html">Book Another 30 Days</a> <button class="btn dark" id="logout">Sign Out</button></div></div><div id="content" class="card">Loading your campaigns…</div></main><script>(function(){const content=document.getElementById('content');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function statusLabel(s){return ({payment_pending:'Payment Pending',paid_pending_approval:'Paid — Awaiting Approval',approved:'Approved / Scheduled',live:'Live',completed:'Completed',refunded:'Refunded'})[s]||s}async function load(){try{const me=await fetch('/wp-json/chadpgt/v1/sponsor/auth/me',{credentials:'same-origin'});const md=await me.json();if(!me.ok||!md.authenticated){location.replace('/sponsor-login.html');return}document.getElementById('title').textContent=md.account.company_name+' Sponsor Dashboard';const r=await fetch('/wp-json/chadpgt/v1/sponsor/dashboard',{credentials:'same-origin'}),d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Could not load dashboard.');if(!d.campaigns.length){content.innerHTML='<div class="empty">No sponsor campaigns yet. <a href="/advertise.html">Book your first 30-day campaign.</a></div>';return}content.innerHTML=d.campaigns.map(c=>`<section class="campaign"><div class="row"><div><strong>${esc(new Date(c.start_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}))} – ${esc(new Date(new Date(c.end_at).getTime()-86400000).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}))}</strong><div class="meta">${esc(c.headline||'Creative pending')}<br>${esc(c.destination_url||'')}</div></div><span class="badge ${c.status==='live'||c.status==='approved'?'live':c.status==='paid_pending_approval'?'paid':''}">${esc(statusLabel(c.status))}</span></div><div class="metrics" style="margin-top:15px"><div class="metric"><div class="k">Impressions</div><div class="v">${Number(c.impressions).toLocaleString()}</div></div><div class="metric"><div class="k">Clicks</div><div class="v">${Number(c.clicks).toLocaleString()}</div></div><div class="metric"><div class="k">CTR</div><div class="v">${Number(c.ctr_percent).toFixed(2)}%</div></div></div><div class="meta">Payment: $${Number(c.price_usd).toFixed(2)} ${esc(c.currency)}${c.discount_code?' · Offer code: '+esc(c.discount_code):''}</div></section>`).join('')}catch(e){content.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}document.getElementById('logout').onclick=async()=>{await fetch('/wp-json/chadpgt/v1/sponsor/auth/logout',{method:'POST',credentials:'same-origin'});location.replace('/sponsor-login.html')};load()})();</script></body></html>
