<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chad P.D. Chee Sponsor Login</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#171b1f;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,470px);background:#fff;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0006}h1{margin:0 0 6px}.sub{color:#66737d;margin-bottom:22px}label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;color:#5d6972;margin-top:14px}input{width:100%;padding:12px;margin-top:6px;border:1px solid #ccd7df;border-radius:9px;font-size:15px}button{width:100%;border:0;border-radius:9px;padding:13px;background:#1479bb;color:#fff;font-weight:900;font-size:15px;margin-top:18px;cursor:pointer}.status{min-height:20px;margin-top:12px;font-size:13px;font-weight:800}.error{color:#a12626}.links{text-align:center;margin-top:18px;font-size:13px}.links a{color:#0b69a8}</style></head><body><main class="card"><h1>Sponsor Portal</h1><div class="sub">Your campaign. Your stats. Chad's questionable supervision.</div><form id="f"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button id="b">Sign In</button><div id="s" class="status"></div></form><div class="links"><a href="/advertise.html">Book a sponsor position</a> · <a href="/">Back to Chad</a></div></main><script>(async()=>{try{const r=await fetch('/wp-json/chadpgt/v1/sponsor/auth/me',{credentials:'same-origin'});const d=await r.json();if(d.authenticated)location.replace('/sponsor-dashboard.html')}catch{}const f=document.getElementById('f'),s=document.getElementById('s'),b=document.getElementById('b');f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;s.className='status';s.textContent='Signing in…';try{const r=await fetch('/wp-json/chadpgt/v1/sponsor/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Sign-in failed.');location.replace('/sponsor-dashboard.html')}catch(err){s.className='status error';s.textContent=err.message;b.disabled=false}})})();</script></body></html>
